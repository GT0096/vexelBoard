name: Release Installers

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0). Defaults to v<package.json version> if left blank.'
        required: false
        default: ''
      draft:
        description: 'Save GitHub Release as draft instead of publishing immediately'
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'v*'
      - '[0-9]*.[0-9]*'

permissions:
  contents: write

jobs:
  build-installers:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            flag: --mac
          - os: windows-latest
            platform: win
            flag: --win

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & build bundles
        run: npm run build

      - name: Package installer (${{ matrix.platform }})
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder ${{ matrix.flag }} --publish never

      - name: Verify installer output
        shell: bash
        run: |
          ls -lh dist/
          if [ "${{ matrix.platform }}" = "mac" ]; then
            ls dist/*.dmg dist/*.zip
          else
            ls dist/*.exe
          fi

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vexelboard-${{ matrix.platform }}-installers
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error

  publish-release:
    if: ${{ !cancelled() }}
    needs: build-installers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release metadata
        id: meta
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRAFT: ${{ inputs.draft }}
          BUILD_RESULT: ${{ needs.build-installers.result }}
        run: |
          TRIMMED_TAG="${INPUT_TAG#"${INPUT_TAG%%[![:space:]]*}"}"
          TRIMMED_TAG="${TRIMMED_TAG%"${TRIMMED_TAG##*[![:space:]]}"}"

          if [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
          elif [ -n "$TRIMMED_TAG" ]; then
            TAG="$TRIMMED_TAG"
          else
            PKG_VER="$(node -p "require('./package.json').version")"
            TAG="v${PKG_VER}"
          fi

          if [ "$INPUT_DRAFT" = "true" ] || [ "$BUILD_RESULT" != "success" ]; then
            IS_DRAFT="true"
          else
            IS_DRAFT="false"
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "draft=${IS_DRAFT}" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: ${TAG} (draft=${IS_DRAFT}, build_result=${BUILD_RESULT})"

      - name: Download built installers
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Verify downloaded installers
        shell: bash
        run: |
          mkdir -p release-files
          ls -lh release-files/
          FILE_COUNT=$(find release-files -maxdepth 1 -type f | wc -l)
          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "::error::No installer artifacts were built by build-installers."
            exit 1
          fi

      - name: Attach installers to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Vexelboard ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: ${{ steps.meta.outputs.draft == 'true' }}
          files: release-files/*
          fail_on_unmatched_files: true
          generate_release_notes: true

      - name: Check matrix build status
        if: ${{ needs.build-installers.result != 'success' }}
        shell: bash
        run: |
          echo "::error::One of the OS installer builds failed (build-installers=${{ needs.build-installers.result }}). Built artifacts were saved to a draft release so nothing was dropped."
          exit 1
