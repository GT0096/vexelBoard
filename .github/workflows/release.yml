name: Release Installers

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Auto version bump when tag is blank (avoids immutable release collisions)'
        required: false
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      tag:
        description: 'Optional explicit release tag (e.g. v1.2.0). Leave blank to auto-bump from the latest release.'
        required: false
        default: ''
      draft:
        description: 'Save GitHub Release as draft instead of publishing immediately'
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'v*'
      - '[0-9]*.[0-9]*'

permissions:
  contents: write

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      draft: ${{ steps.version.outputs.draft }}

    steps:
      - name: Checkout repository with full tag history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve next release tag & version
        id: version
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_BUMP: ${{ inputs.bump }}
          INPUT_DRAFT: ${{ inputs.draft }}
        run: |
          node <<'EOF'
          const { execSync } = require('child_process')
          const fs = require('fs')

          const parseSemver = (raw) => {
            const m = String(raw || '').trim().match(/^v?(\d+)\.(\d+)\.(\d+)$/)
            if (!m) return null
            return [Number(m[1]), Number(m[2]), Number(m[3])]
          }

          const cmpSemver = (a, b) => {
            for (let i = 0; i < 3; i++) {
              if (a[i] !== b[i]) return a[i] - b[i]
            }
            return 0
          }

          const bumpSemver = (ver, kind) => {
            const [maj, min, pat] = ver
            if (kind === 'major') return [maj + 1, 0, 0]
            if (kind === 'minor') return [maj, min + 1, 0]
            return [maj, min, pat + 1]
          }

          const fmt = (ver) => `${ver[0]}.${ver[1]}.${ver[2]}`

          async function fetchReleases() {
            const repo = process.env.GITHUB_REPOSITORY
            const token = process.env.GITHUB_TOKEN
            if (!repo || !token) return []
            try {
              const res = await fetch(`https://api.github.com/repos/${repo}/releases?per_page=100`, {
                headers: {
                  Authorization: `Bearer ${token}`,
                  Accept: 'application/vnd.github+json',
                  'User-Agent': 'vexelboard-release-workflow'
                }
              })
              if (!res.ok) return []
              return await res.json()
            } catch {
              return []
            }
          }

          async function main() {
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
            const pkgVer = parseSemver(pkg.version) || [1, 0, 0]

            const gitTags = execSync('git tag -l', { encoding: 'utf8' })
              .split(/\r?\n/)
              .map((t) => t.trim())
              .filter(Boolean)

            const releases = await fetchReleases()
            const publishedTags = new Set(
              releases.filter((r) => !r.draft && r.tag_name).map((r) => String(r.tag_name).trim())
            )
            const allExistingTags = new Set([...gitTags, ...releases.map((r) => String(r.tag_name || '').trim()).filter(Boolean)])

            const refType = process.env.REF_TYPE
            const refName = (process.env.REF_NAME || '').trim()
            const inputTag = (process.env.INPUT_TAG || '').trim()
            const bumpKind = (process.env.INPUT_BUMP || 'patch').trim()
            const inputDraft = process.env.INPUT_DRAFT === 'true'

            let tag = ''
            let version = ''

            if (refType === 'tag') {
              tag = refName
              version = refName.replace(/^v/i, '')
            } else if (inputTag) {
              tag = inputTag.startsWith('v') ? inputTag : `v${inputTag}`
              version = tag.replace(/^v/i, '')
            } else {
              // Auto-resolve next free SemVer tag from existing tags/releases & package.json
              let highest = pkgVer
              for (const t of allExistingTags) {
                const parsed = parseSemver(t)
                if (parsed && cmpSemver(parsed, highest) > 0) {
                  highest = parsed
                }
              }

              let candidate = highest
              if (allExistingTags.has(`v${fmt(candidate)}`) || allExistingTags.has(fmt(candidate))) {
                candidate = bumpSemver(candidate, bumpKind)
                while (allExistingTags.has(`v${fmt(candidate)}`) || allExistingTags.has(fmt(candidate))) {
                  candidate = bumpSemver(candidate, 'patch')
                }
              }

              version = fmt(candidate)
              tag = `v${version}`
            }

            if (publishedTags.has(tag)) {
              console.error(`::error::Release ${tag} is already published (immutable). Leave tag blank to auto-bump or provide a new version tag.`)
              process.exit(1)
            }

            const out = process.env.GITHUB_OUTPUT
            fs.appendFileSync(out, `tag=${tag}\n`)
            fs.appendFileSync(out, `version=${version}\n`)
            fs.appendFileSync(out, `draft=${inputDraft ? 'true' : 'false'}\n`)
            console.log(`Resolved release -> tag=${tag}, version=${version}, draft=${inputDraft}`)
          }

          main().catch((err) => {
            console.error(err)
            process.exit(1)
          })
          EOF

  build-installers:
    needs: resolve-version
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            flag: --mac
          - os: windows-latest
            platform: win
            flag: --win

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply resolved release version
        shell: bash
        run: |
          npm version "${{ needs.resolve-version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Typecheck & build bundles
        run: npm run build

      - name: Ensure macOS DMG setup script is executable
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          sed -i '' 's/\r$//' build/mac/Vexelboard-Setup.command
          chmod +x build/mac/Vexelboard-Setup.command

      - name: Package installer (${{ matrix.platform }})
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          for var in CSC_LINK CSC_KEY_PASSWORD CSC_INSTALLER_LINK CSC_INSTALLER_KEY_PASSWORD WIN_CSC_LINK WIN_CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [ -z "${!var:-}" ]; then
              unset "$var"
            fi
          done
          if [ -n "${CSC_LINK:-}" ] || [ -n "${WIN_CSC_LINK:-}" ]; then
            export CSC_IDENTITY_AUTO_DISCOVERY=true
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npx electron-builder ${{ matrix.flag }} --publish never

      - name: Verify installer output
        shell: bash
        run: |
          ls -lh dist/
          if [ "${{ matrix.platform }}" = "mac" ]; then
            ls dist/*.dmg dist/*.zip
            for app in dist/mac*/Vexelboard.app; do
              if [ -d "$app" ]; then
                echo "Verifying code signature: $app"
                codesign --verify --deep --strict --verbose=2 "$app"
              fi
            done
            for dmg in dist/*.dmg; do
              echo "Verifying DMG integrity: $dmg"
              hdiutil verify "$dmg"
            done
          else
            ls dist/*.exe
          fi

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vexelboard-${{ matrix.platform }}-installers
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error

  publish-release:
    if: ${{ !cancelled() && needs.resolve-version.result == 'success' }}
    needs: [resolve-version, build-installers]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built installers
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Create stable "latest" installer filenames
        shell: bash
        run: |
          shopt -s nullglob
          for f in release-files/Vexelboard-*-Setup.exe; do
            cp -f "$f" release-files/Vexelboard-latest-Setup.exe
            break
          done
          for f in release-files/Vexelboard-*-arm64.dmg; do
            cp -f "$f" release-files/Vexelboard-latest-arm64.dmg
            break
          done
          for f in release-files/Vexelboard-*-x64.dmg; do
            cp -f "$f" release-files/Vexelboard-latest-x64.dmg
            break
          done

      - name: Verify downloaded installers
        shell: bash
        run: |
          mkdir -p release-files
          ls -lh release-files/
          FILE_COUNT=$(find release-files -maxdepth 1 -type f | wc -l)
          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "::error::No installer artifacts were built by build-installers."
            exit 1
          fi

      - name: Attach installers to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ needs.resolve-version.outputs.tag }}
          name: Vexelboard ${{ needs.resolve-version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: ${{ needs.resolve-version.outputs.draft == 'true' || needs.build-installers.result != 'success' }}
          make_latest: ${{ (needs.resolve-version.outputs.draft != 'true' && needs.build-installers.result == 'success') && 'true' || 'false' }}
          files: release-files/*
          fail_on_unmatched_files: true
          generate_release_notes: true

      - name: Check matrix build status
        if: ${{ needs.build-installers.result != 'success' }}
        shell: bash
        run: |
          echo "::error::One of the OS installer builds failed (build-installers=${{ needs.build-installers.result }}). Built artifacts were saved to a draft release so nothing was dropped."
          exit 1
