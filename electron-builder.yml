appId: com.vexelboard.app
productName: Vexelboard
copyright: Copyright © 2026 https://github.com/GT0096/vexelBoard
afterPack: scripts/afterPack-mac.cjs
afterSign: scripts/notarize-mac.cjs
directories:
  buildResources: build
  output: dist
files:
  - '!**/.vscode/*'
  - '!**/.agents/*'
  - '!src/*'
  - '!scripts/*'
  - '!graphify-out/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md,implementation.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
  - '**/*.node'
  - '**/*.dll'
  - '**/*.dylib'
  - '**/*.so'
  - node_modules/better-sqlite3/**
  - node_modules/sqlite-vec/**
  - node_modules/sqlite-vec-*/**
  - node_modules/@visioncortex/vtracer/**
  - node_modules/@huggingface/transformers/**
  - node_modules/onnxruntime-node/**
  - node_modules/onnxruntime-common/**
  - node_modules/onnxruntime-web/**
win:
  executableName: Vexelboard
  icon: build/icon.ico
  requestedExecutionLevel: asInvoker
  verifyUpdateCodeSignature: false
  signAndEditExecutable: true
  signtoolOptions:
    publisherName:
      - Vexelboard
    signingHashAlgorithms:
      - sha256
    rfc3161TimeStampServer: http://timestamp.digicert.com
    timeStampServer: http://timestamp.digicert.com
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  artifactName: Vexelboard-${version}-Setup.${ext}
  shortcutName: Vexelboard
  uninstallDisplayName: Vexelboard
  createDesktopShortcut: always
  createStartMenuShortcut: true
  runAfterFinish: true
  include: build/installer.nsh
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  deleteAppDataOnUninstall: false
mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  extendInfo:
    NSCameraUsageDescription: Vexelboard uses your camera for optional hand-tracking gesture control.
    NSMicrophoneUsageDescription: Vexelboard uses your microphone for optional voice notes.
    NSDocumentsFolderUsageDescription: Vexelboard accesses Documents when you open or export study files.
    NSDownloadsFolderUsageDescription: Vexelboard accesses Downloads when you save or import files.
dmg:
  title: Vexelboard ${version}
  icon: build/icon.icns
  format: UDZO
  sign: false
  writeUpdateInfo: false
  artifactName: Vexelboard-${version}-${arch}.${ext}
  window:
    width: 580
    height: 410
  contents:
    - x: 150
      y: 150
    - x: 430
      y: 150
      type: link
      path: /Applications
    - x: 290
      y: 310
      type: file
      path: build/mac/Vexelboard-Setup.command
      name: Update or Uninstall Vexelboard.command
linux:
  target:
    - AppImage
    - deb
  maintainer: https://github.com/GT0096/vexelBoard
  category: Education
appImage:
  artifactName: Vexelboard-${version}-${arch}.${ext}
npmRebuild: false
